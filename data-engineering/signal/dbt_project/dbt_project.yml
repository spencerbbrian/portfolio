name: 'signal'
version: '1.0.0'
config-version: 2

profile: 'signal'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  signal:
    staging:
      +materialized: view
      +schema: staging
    raw_vault:
      +materialized: table
      +schema: raw_vault
    marts:
      +materialized: table
      +schema: marts
