version: 2

sources:
  - name: churn_radar
    database: "{{ target.project }}"
    schema: churn_radar_raw
    description: "Raw tables landed by Airbyte from the Churn Radar source API."
    tables:
      - name: customers
        description: "Raw customer records -- one row per company, current state only (no history)."
      - name: billing_events
        description: "Raw billing lifecycle events: subscription started/upgraded/downgraded/canceled, payment failures."
      - name: usage_events
        description: "Raw product usage events: logins, feature usage, support tickets opened/resolved."
